name: CI - Algorythmos Quality Pipeline

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master
      - main

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Single Astro pipeline job — ordered gates against the real build output.
  # ============================================================================
  quality:
    name: 🏗️ Astro Quality Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # --- Hard gates that don't need a build ---
      - name: Lint (eslint)
        run: npm run lint

      - name: Type-check (astro check)
        run: npm run check

      - name: i18n parity (EN/FR)
        run: npm run i18n:check

      - name: Health check (hardcoded strings, alt text, image weight)
        run: npm run health:check

      # Security audit — production deps only. The build is adapter-free (static site +
      # /api serverless), so prod deps are currently clean; kept non-blocking as a safety net.
      - name: Security audit (prod deps, non-blocking)
        run: npm audit --omit=dev --audit-level=high || true

      # --- Build, then validate the built output ---
      - name: Build (astro build → dist/)
        run: npm run build

      - name: SEO validation (dist/)
        run: npm run seo:check

      - name: Internal link check (dist/)
        run: npm run link:check

      - name: Unit tests (vitest)
        run: npm test -- --run

      # --- Summary ---
      - name: CI summary
        if: always()
        run: |
          echo "📊 Astro CI Pipeline Summary"
          echo "============================"
          echo "Job result: ${{ job.status }}"
          echo "Gates: astro check → i18n:check → health:check → audit(non-fatal) → build → seo:check → link:check → test"
          echo "============================"
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ CI Pipeline PASSED"
          else
            echo "❌ CI Pipeline FAILED"
          fi
