name: CI — quality pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, validate and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --- Source gates (no build needed) ---
      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run check

      - name: i18n parity, attribute copy and meta lengths
        run: npm run i18n:check

      - name: Health check (CTAs, a11y attributes, image weight)
        run: npm run health:check

      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      # --- Build once, validate the output ---
      - name: Build
        run: npm run build

      - name: SEO validation
        run: npm run seo:check

      - name: Internal links
        run: npm run link:check

      - name: No leaked translation keys
        run: npm run keys:check

      - name: Bundle weight report
        run: npm run perf

      - name: Unit tests
        run: npm test -- --run

      # --- Browser tests against the built output (preview server reuses dist/) ---
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: E2E + accessibility (Chromium, WebKit)
        run: npx playwright test

      - name: Core Web Vitals budget (Lighthouse, mobile)
        run: node scripts/lh-check.mjs --strict

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
