version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Sydney
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      tooling:
        patterns: ["eslint*", "@playwright/*", "vitest", "@vitest/*", "typescript", "lighthouse"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
