<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" width="1120" height="760" role="img" aria-label="AI-ready website performance panel">
  <defs>
    <style>text{font-family:'Inter',system-ui,-apple-system,Segoe UI,sans-serif;}.h{fill:#f3f3f8;}.m{fill:#9a9cb4;}.s{fill:#6c6e86;}.ring{fill:none;stroke-width:7;stroke-linecap:round;transform:rotate(-90deg);transform-origin:center;}</style>
  </defs>
  <rect width="1120" height="760" fill="#0c0c13"/>
  <rect width="1120" height="48" fill="#14141e"/>
  <line x1="0" y1="48" x2="1120" y2="48" stroke="#ffffff" stroke-opacity="0.07"/>
  <circle cx="24" cy="24" r="5" fill="#ffffff" fill-opacity="0.18"/><circle cx="42" cy="24" r="5" fill="#ffffff" fill-opacity="0.18"/><circle cx="60" cy="24" r="5" fill="#ffffff" fill-opacity="0.18"/>
  <rect x="392" y="12" width="336" height="24" rx="12" fill="#222232"/>
  <text x="560" y="29" font-size="12" text-anchor="middle" class="m">algorythmos.com · audit</text>
  <text x="40" y="92" font-size="18" font-weight="600" class="h">Site performance</text>
  <text x="40" y="114" font-size="12.5" class="m">production · mobile · Lighthouse</text>
  <rect x="958" y="76" width="122" height="28" rx="14" fill="#34d399" fill-opacity="0.12"/>
  <circle cx="980" cy="90" r="4" fill="#34d399"/><text x="994" y="94" font-size="11.5" fill="#34d399">all passing</text>

  <!-- score rings -->
  <g>
    <circle cx="180" cy="240" r="46" class="ring" stroke="#34d399" stroke-dasharray="289 289"/>
    <circle cx="180" cy="240" r="46" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="7"/>
    <circle cx="180" cy="240" r="46" class="ring" stroke="#34d399" stroke-dasharray="289 0"/>
    <text x="180" y="250" font-size="30" font-weight="700" text-anchor="middle" class="h">100</text>
    <text x="180" y="318" font-size="12.5" text-anchor="middle" class="m">Performance</text>
  </g>
  <g>
    <circle cx="430" cy="240" r="46" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="7"/>
    <circle cx="430" cy="240" r="46" class="ring" stroke="#34d399" stroke-dasharray="289 0"/>
    <text x="430" y="250" font-size="30" font-weight="700" text-anchor="middle" class="h">100</text>
    <text x="430" y="318" font-size="12.5" text-anchor="middle" class="m">Accessibility</text>
  </g>
  <g>
    <circle cx="680" cy="240" r="46" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="7"/>
    <circle cx="680" cy="240" r="46" class="ring" stroke="#34d399" stroke-dasharray="289 0"/>
    <text x="680" y="250" font-size="30" font-weight="700" text-anchor="middle" class="h">100</text>
    <text x="680" y="318" font-size="12.5" text-anchor="middle" class="m">Best Practices</text>
  </g>
  <g>
    <circle cx="930" cy="240" r="46" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="7"/>
    <circle cx="930" cy="240" r="46" class="ring" stroke="#34d399" stroke-dasharray="289 0"/>
    <text x="930" y="250" font-size="30" font-weight="700" text-anchor="middle" class="h">100</text>
    <text x="930" y="318" font-size="12.5" text-anchor="middle" class="m">SEO</text>
  </g>

  <!-- core web vitals -->
  <rect x="40" y="368" width="640" height="332" rx="14" fill="#15151f" stroke="#ffffff" stroke-opacity="0.07"/>
  <text x="64" y="404" font-size="14" font-weight="600" class="h">Core Web Vitals</text>
  <text x="64" y="424" font-size="11.5" class="s">real-user · 75th percentile</text>
  <g>
    <text x="64" y="476" font-size="12.5" class="m">Largest Contentful Paint</text>
    <text x="656" y="476" font-size="16" font-weight="700" text-anchor="end" fill="#34d399">1.2 s</text>
    <rect x="64" y="488" width="592" height="6" rx="3" fill="#ffffff" fill-opacity="0.08"/><rect x="64" y="488" width="150" height="6" rx="3" fill="#34d399"/>
  </g>
  <g>
    <text x="64" y="538" font-size="12.5" class="m">Interaction to Next Paint</text>
    <text x="656" y="538" font-size="16" font-weight="700" text-anchor="end" fill="#34d399">48 ms</text>
    <rect x="64" y="550" width="592" height="6" rx="3" fill="#ffffff" fill-opacity="0.08"/><rect x="64" y="550" width="80" height="6" rx="3" fill="#34d399"/>
  </g>
  <g>
    <text x="64" y="600" font-size="12.5" class="m">Cumulative Layout Shift</text>
    <text x="656" y="600" font-size="16" font-weight="700" text-anchor="end" fill="#34d399">0.01</text>
    <rect x="64" y="612" width="592" height="6" rx="3" fill="#ffffff" fill-opacity="0.08"/><rect x="64" y="612" width="40" height="6" rx="3" fill="#34d399"/>
  </g>
  <text x="64" y="664" font-size="11.5" class="s">static-first · islands only where needed · self-hosted fonts</text>

  <!-- AI-ready checklist -->
  <rect x="700" y="368" width="380" height="332" rx="14" fill="#15151f" stroke="#ffffff" stroke-opacity="0.07"/>
  <text x="724" y="404" font-size="14" font-weight="600" class="h">AI &amp; search ready</text>
  <g font-size="12.5">
    <circle cx="730" cy="446" r="9" fill="#34d399" fill-opacity="0.15"/><path d="M725 446 l3 3 l7 -8" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="750" y="450" class="h">Structured data (JSON-LD)</text>
    <circle cx="730" cy="490" r="9" fill="#34d399" fill-opacity="0.15"/><path d="M725 490 l3 3 l7 -8" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="750" y="494" class="h">Sitemap + hreflang</text>
    <circle cx="730" cy="534" r="9" fill="#34d399" fill-opacity="0.15"/><path d="M725 534 l3 3 l7 -8" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="750" y="538" class="h">robots.txt · all AI crawlers</text>
    <circle cx="730" cy="578" r="9" fill="#34d399" fill-opacity="0.15"/><path d="M725 578 l3 3 l7 -8" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="750" y="582" class="h">llms.txt + llms-full.txt</text>
    <circle cx="730" cy="622" r="9" fill="#34d399" fill-opacity="0.15"/><path d="M725 622 l3 3 l7 -8" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="750" y="626" class="h">Open Graph cards</text>
  </g>
</svg>
