<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" width="1120" height="760" role="img" aria-label="Agentic automation console">
  <defs>
    <linearGradient id="aa-cta" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
    <style>text{font-family:'Inter',system-ui,-apple-system,Segoe UI,sans-serif;}.h{fill:#f3f3f8;}.m{fill:#9a9cb4;}.s{fill:#6c6e86;}</style>
  </defs>
  <rect width="1120" height="760" fill="#0c0c13"/>
  <rect width="1120" height="48" fill="#14141e"/>
  <line x1="0" y1="48" x2="1120" y2="48" stroke="#ffffff" stroke-opacity="0.07"/>
  <circle cx="24" cy="24" r="5" fill="#ffffff" fill-opacity="0.18"/><circle cx="42" cy="24" r="5" fill="#ffffff" fill-opacity="0.18"/><circle cx="60" cy="24" r="5" fill="#ffffff" fill-opacity="0.18"/>
  <rect x="372" y="12" width="376" height="24" rx="12" fill="#222232"/>
  <text x="560" y="29" font-size="12" text-anchor="middle" class="m">app.algorythmos.com/agents/contract-review</text>
  <text x="40" y="92" font-size="18" font-weight="600" class="h">Agent · Contract review</text>
  <text x="40" y="114" font-size="12.5" class="m">run #2048 · 4 of 6 steps · awaiting approval</text>
  <rect x="930" y="76" width="150" height="28" rx="14" fill="#22d3ee" fill-opacity="0.12"/>
  <circle cx="952" cy="90" r="4" fill="#22d3ee"/><text x="966" y="94" font-size="11.5" fill="#22d3ee">human-in-the-loop</text>

  <!-- run timeline -->
  <rect x="40" y="140" width="660" height="560" rx="14" fill="#15151f" stroke="#ffffff" stroke-opacity="0.07"/>
  <text x="64" y="176" font-size="14" font-weight="600" class="h">Run timeline</text>
  <line x1="86" y1="206" x2="86" y2="650" stroke="#ffffff" stroke-opacity="0.1"/>
  <line x1="86" y1="206" x2="86" y2="470" stroke="#a78bfa" stroke-width="2"/>
  <!-- steps -->
  <g>
    <circle cx="86" cy="224" r="9" fill="#1d1d2b" stroke="#34d399" stroke-width="1.5"/><path d="M81 224 l3 3 l7 -7" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="116" y="220" font-size="13" font-weight="600" class="h">Plan</text>
    <text x="116" y="238" font-size="10.5" class="s">decomposed into 5 tool steps</text>
    <text x="676" y="222" font-size="10.5" text-anchor="end" fill="#34d399">done</text>
  </g>
  <g>
    <circle cx="86" cy="294" r="9" fill="#1d1d2b" stroke="#34d399" stroke-width="1.5"/><path d="M81 294 l3 3 l7 -7" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="116" y="290" font-size="13" font-weight="600" class="h">Fetch document</text>
    <text x="116" y="308" font-size="10.5" class="s">tool: storage.get · validated</text>
    <text x="676" y="292" font-size="10.5" text-anchor="end" fill="#34d399">done</text>
  </g>
  <g>
    <circle cx="86" cy="364" r="9" fill="#1d1d2b" stroke="#34d399" stroke-width="1.5"/><path d="M81 364 l3 3 l7 -7" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="116" y="360" font-size="13" font-weight="600" class="h">Extract clauses</text>
    <text x="116" y="378" font-size="10.5" class="s">tool: doc.extract · 18 clauses</text>
    <text x="676" y="362" font-size="10.5" text-anchor="end" fill="#34d399">done</text>
  </g>
  <g>
    <circle cx="86" cy="434" r="9" fill="#1d1d2b" stroke="#34d399" stroke-width="1.5"/><path d="M81 434 l3 3 l7 -7" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="116" y="430" font-size="13" font-weight="600" class="h">Risk check</text>
    <text x="116" y="448" font-size="10.5" class="s">tool: policy.eval · 2 clauses flagged</text>
    <text x="676" y="432" font-size="10.5" text-anchor="end" fill="#facc15">review</text>
  </g>
  <g>
    <circle cx="86" cy="504" r="9" fill="#1d1d2b" stroke="#22d3ee" stroke-width="2"/><circle cx="86" cy="504" r="3.5" fill="#22d3ee"/>
    <text x="116" y="500" font-size="13" font-weight="600" class="h">Human approval</text>
    <text x="116" y="518" font-size="10.5" fill="#22d3ee">paused · waiting for reviewer</text>
    <text x="676" y="502" font-size="10.5" text-anchor="end" fill="#22d3ee">pending</text>
  </g>
  <g>
    <circle cx="86" cy="574" r="9" fill="#13131c" stroke="#3a3a4e" stroke-width="1.5"/>
    <text x="116" y="570" font-size="13" font-weight="600" class="m">Post to system</text>
    <text x="116" y="588" font-size="10.5" class="s">tool: erp.write · blocked until approved</text>
    <text x="676" y="572" font-size="10.5" text-anchor="end" class="s">queued</text>
  </g>
  <rect x="64" y="614" width="612" height="58" rx="10" fill="#16161f" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="84" y="640" font-size="11.5" class="m">2 clauses need a decision —</text>
  <rect x="300" y="626" width="92" height="30" rx="8" fill="url(#aa-cta)"/><text x="346" y="646" font-size="12" font-weight="600" text-anchor="middle" fill="#fff">Approve</text>
  <rect x="404" y="626" width="88" height="30" rx="8" fill="none" stroke="#3a3a4e"/><text x="448" y="646" font-size="12" text-anchor="middle" class="m">Reject</text>

  <!-- guardrails -->
  <rect x="720" y="140" width="360" height="560" rx="14" fill="#15151f" stroke="#ffffff" stroke-opacity="0.07"/>
  <text x="744" y="176" font-size="14" font-weight="600" class="h">Guardrails</text>
  <g font-size="12.5">
    <circle cx="750" cy="216" r="9" fill="#34d399" fill-opacity="0.15"/><path d="M745 216 l3 3 l7 -8" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="770" y="220" class="h">Allow-listed tools only</text>
    <circle cx="750" cy="262" r="9" fill="#34d399" fill-opacity="0.15"/><path d="M745 262 l3 3 l7 -8" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="770" y="266" class="h">Input / output validation</text>
    <circle cx="750" cy="308" r="9" fill="#34d399" fill-opacity="0.15"/><path d="M745 308 l3 3 l7 -8" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="770" y="312" class="h">PII redaction</text>
    <circle cx="750" cy="354" r="9" fill="#22d3ee" fill-opacity="0.15"/><path d="M745 354 l3 3 l7 -8" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="770" y="358" class="h">Approval gate on writes</text>
    <circle cx="750" cy="400" r="9" fill="#34d399" fill-opacity="0.15"/><path d="M745 400 l3 3 l7 -8" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="770" y="404" class="h">Full audit trail</text>
  </g>
  <line x1="744" y1="440" x2="1056" y2="440" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="744" y="476" font-size="12.5" font-weight="600" class="h">This run</text>
  <g font-size="11.5">
    <text x="744" y="510" class="m">Tool calls</text><text x="1056" y="510" text-anchor="end" class="h">5</text>
    <text x="744" y="540" class="m">Policy checks</text><text x="1056" y="540" text-anchor="end" class="h">12 passed</text>
    <text x="744" y="570" class="m">Redactions</text><text x="1056" y="570" text-anchor="end" class="h">3</text>
    <text x="744" y="600" class="m">Tokens</text><text x="1056" y="600" text-anchor="end" class="h">48.2k</text>
    <text x="744" y="630" class="m">Duration</text><text x="1056" y="630" text-anchor="end" class="h">7.4 s</text>
  </g>
</svg>
