<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" width="1120" height="540" role="img" aria-label="Sydney skyline motif">
  <defs>
    <linearGradient id="syd-stroke" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <radialGradient id="syd-glow" cx="50%" cy="78%" r="60%"><stop offset="0" stop-color="#7c5cf0" stop-opacity="0.22"/><stop offset="1" stop-color="#7c5cf0" stop-opacity="0"/></radialGradient>
    <style>text{font-family:'Inter',system-ui,-apple-system,Segoe UI,sans-serif;}.h{fill:#f3f3f8;}.m{fill:#9a9cb4;}</style>
  </defs>
  <rect width="1120" height="540" fill="#0c0c13"/>
  <rect width="1120" height="540" fill="url(#syd-glow)"/>

  <!-- back skyline (subtle) -->
  <g fill="#ffffff" fill-opacity="0.05">
    <rect x="740" y="300" width="36" height="120"/><rect x="784" y="260" width="28" height="160"/><rect x="820" y="320" width="40" height="100"/><rect x="868" y="290" width="24" height="130"/><rect x="900" y="250" width="30" height="170"/><rect x="940" y="310" width="44" height="110"/><rect x="992" y="280" width="26" height="140"/>
  </g>

  <!-- water line -->
  <line x1="60" y1="420" x2="1060" y2="420" stroke="#ffffff" stroke-opacity="0.12"/>
  <path d="M60 438 Q 280 430 520 438 T 1060 438" fill="none" stroke="#22d3ee" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Harbour Bridge -->
  <g stroke="url(#syd-stroke)" fill="none" stroke-linecap="round">
    <!-- arch -->
    <path d="M150 420 Q 360 196 570 420" stroke-width="3"/>
    <!-- deck -->
    <line x1="138" y1="372" x2="582" y2="372" stroke-width="2.5"/>
    <!-- hangers -->
    <g stroke-width="1.2" stroke-opacity="0.55">
      <line x1="210" y1="300" x2="210" y2="372"/><line x1="258" y1="270" x2="258" y2="372"/><line x1="306" y1="252" x2="306" y2="372"/><line x1="360" y1="246" x2="360" y2="372"/><line x1="414" y1="252" x2="414" y2="372"/><line x1="462" y1="270" x2="462" y2="372"/><line x1="510" y1="300" x2="510" y2="372"/>
    </g>
  </g>
  <!-- pylons -->
  <rect x="156" y="356" width="20" height="64" fill="#15151f" stroke="#ffffff" stroke-opacity="0.18"/>
  <rect x="544" y="356" width="20" height="64" fill="#15151f" stroke="#ffffff" stroke-opacity="0.18"/>

  <!-- Opera House sails -->
  <g fill="none" stroke="url(#syd-stroke)" stroke-width="2.5" stroke-linejoin="round">
    <path d="M628 420 Q 648 300 700 420 Z"/>
    <path d="M664 420 Q 690 286 748 420 Z"/>
    <path d="M708 420 Q 740 300 792 420 Z"/>
    <path d="M756 420 Q 782 312 824 420 Z"/>
  </g>
  <line x1="620" y1="420" x2="836" y2="420" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>

  <!-- location pin + label -->
  <g>
    <path d="M120 120 a18 18 0 1 0 0.01 0 M120 120 c -9 14 -9 22 0 34 c 9 -12 9 -20 0 -34 Z" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="120" cy="116" r="6" fill="#22d3ee"/>
    <text x="160" y="112" font-size="24" font-weight="700" class="h">Sydney</text>
    <text x="160" y="136" font-size="13" class="m">New South Wales · Australia · APAC</text>
  </g>

  <!-- sector chips -->
  <g>
    <rect x="836" y="92" width="92" height="26" rx="13" fill="#15151f" stroke="#ffffff" stroke-opacity="0.08"/><text x="882" y="109" font-size="11" text-anchor="middle" class="m">Healthcare</text>
    <rect x="936" y="92" width="74" height="26" rx="13" fill="#15151f" stroke="#ffffff" stroke-opacity="0.08"/><text x="973" y="109" font-size="11" text-anchor="middle" class="m">Finance</text>
    <rect x="884" y="126" width="80" height="26" rx="13" fill="#15151f" stroke="#ffffff" stroke-opacity="0.08"/><text x="924" y="143" font-size="11" text-anchor="middle" class="m">Mining</text>
  </g>
</svg>
