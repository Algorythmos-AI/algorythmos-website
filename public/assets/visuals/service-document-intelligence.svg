<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" width="1120" height="760" role="img" aria-label="Document intelligence interface">
  <defs>
    <linearGradient id="di-cta" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
    <style>text{font-family:'Inter',system-ui,-apple-system,Segoe UI,sans-serif;}.h{fill:#f3f3f8;}.m{fill:#9a9cb4;}.s{fill:#6c6e86;}</style>
  </defs>
  <rect width="1120" height="760" fill="#0c0c13"/>
  <!-- chrome -->
  <rect width="1120" height="48" fill="#14141e"/>
  <line x1="0" y1="48" x2="1120" y2="48" stroke="#ffffff" stroke-opacity="0.07"/>
  <circle cx="24" cy="24" r="5" fill="#ffffff" fill-opacity="0.18"/><circle cx="42" cy="24" r="5" fill="#ffffff" fill-opacity="0.18"/><circle cx="60" cy="24" r="5" fill="#ffffff" fill-opacity="0.18"/>
  <rect x="392" y="12" width="336" height="24" rx="12" fill="#222232"/>
  <text x="560" y="29" font-size="12" text-anchor="middle" class="m">app.algorythmos.com/documents</text>
  <!-- header -->
  <text x="40" y="92" font-size="18" font-weight="600" class="h">Document intelligence</text>
  <text x="40" y="114" font-size="12.5" class="m">Invoice batch · 1 of 240 · extraction</text>
  <rect x="940" y="74" width="140" height="30" rx="9" fill="url(#di-cta)"/>
  <text x="1010" y="94" font-size="12.5" font-weight="600" text-anchor="middle" fill="#fff">Export to ERP</text>

  <!-- document panel -->
  <rect x="40" y="140" width="470" height="560" rx="14" fill="#15151f" stroke="#ffffff" stroke-opacity="0.07"/>
  <rect x="72" y="176" width="406" height="488" rx="8" fill="#f6f6f4"/>
  <text x="96" y="222" font-size="17" font-weight="700" fill="#1b1b24">Acme Pty Ltd</text>
  <text x="96" y="244" font-size="10.5" fill="#6a6a76">INVOICE</text>
  <!-- highlighted: invoice # -->
  <rect x="320" y="200" width="134" height="30" rx="6" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="330" y="214" font-size="9" fill="#7c5cf0">Invoice #</text>
  <text x="330" y="226" font-size="11" font-weight="600" fill="#1b1b24">INV-2048</text>
  <!-- highlighted: date -->
  <rect x="320" y="240" width="134" height="30" rx="6" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="330" y="254" font-size="9" fill="#0e9fb8">Date</text>
  <text x="330" y="266" font-size="11" font-weight="600" fill="#1b1b24">2026-05-12</text>
  <!-- line items -->
  <line x1="96" y1="300" x2="454" y2="300" stroke="#dededa"/>
  <g fill="#c9c9c4"><rect x="96" y="320" width="220" height="9" rx="4"/><rect x="380" y="320" width="74" height="9" rx="4"/><rect x="96" y="348" width="190" height="9" rx="4"/><rect x="380" y="348" width="74" height="9" rx="4"/><rect x="96" y="376" width="234" height="9" rx="4"/><rect x="380" y="376" width="74" height="9" rx="4"/><rect x="96" y="404" width="170" height="9" rx="4"/><rect x="380" y="404" width="74" height="9" rx="4"/></g>
  <line x1="96" y1="440" x2="454" y2="440" stroke="#dededa"/>
  <!-- highlighted: total -->
  <rect x="300" y="460" width="154" height="34" rx="6" fill="none" stroke="#34d399" stroke-width="1.5"/>
  <text x="312" y="476" font-size="9" fill="#1c9e74">Total</text>
  <text x="312" y="489" font-size="13" font-weight="700" fill="#1b1b24">$12,480.00</text>

  <!-- extract arrow -->
  <line x1="524" y1="420" x2="566" y2="420" stroke="#a78bfa" stroke-width="2"/>
  <path d="M566 414 L578 420 L566 426 Z" fill="#a78bfa"/>

  <!-- extracted fields panel -->
  <rect x="596" y="140" width="484" height="560" rx="14" fill="#15151f" stroke="#ffffff" stroke-opacity="0.07"/>
  <text x="624" y="180" font-size="14" font-weight="600" class="h">Extracted fields</text>
  <text x="980" y="180" font-size="11.5" fill="#34d399">5 / 5 validated</text>

  <!-- field rows: label, value, confidence bar -->
  <g>
    <text x="624" y="224" font-size="11.5" class="s">Invoice number</text>
    <text x="624" y="244" font-size="14" font-weight="600" class="h">INV-2048</text>
    <text x="1052" y="224" font-size="11" text-anchor="end" fill="#34d399">99%</text>
    <rect x="900" y="234" width="152" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.08"/><rect x="900" y="234" width="150" height="5" rx="2.5" fill="#34d399"/>
  </g>
  <line x1="624" y1="268" x2="1052" y2="268" stroke="#ffffff" stroke-opacity="0.05"/>
  <g>
    <text x="624" y="300" font-size="11.5" class="s">Invoice date</text>
    <text x="624" y="320" font-size="14" font-weight="600" class="h">2026-05-12</text>
    <text x="1052" y="300" font-size="11" text-anchor="end" fill="#34d399">98%</text>
    <rect x="900" y="310" width="152" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.08"/><rect x="900" y="310" width="149" height="5" rx="2.5" fill="#34d399"/>
  </g>
  <line x1="624" y1="344" x2="1052" y2="344" stroke="#ffffff" stroke-opacity="0.05"/>
  <g>
    <text x="624" y="376" font-size="11.5" class="s">Vendor</text>
    <text x="624" y="396" font-size="14" font-weight="600" class="h">Acme Pty Ltd</text>
    <text x="1052" y="376" font-size="11" text-anchor="end" fill="#34d399">97%</text>
    <rect x="900" y="386" width="152" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.08"/><rect x="900" y="386" width="147" height="5" rx="2.5" fill="#34d399"/>
  </g>
  <line x1="624" y1="420" x2="1052" y2="420" stroke="#ffffff" stroke-opacity="0.05"/>
  <g>
    <text x="624" y="452" font-size="11.5" class="s">Total amount</text>
    <text x="624" y="472" font-size="14" font-weight="600" class="h">$12,480.00</text>
    <text x="1052" y="452" font-size="11" text-anchor="end" fill="#facc15">95%</text>
    <rect x="900" y="462" width="152" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.08"/><rect x="900" y="462" width="144" height="5" rx="2.5" fill="#facc15"/>
  </g>
  <line x1="624" y1="496" x2="1052" y2="496" stroke="#ffffff" stroke-opacity="0.05"/>
  <g>
    <text x="624" y="528" font-size="11.5" class="s">Tax (GST)</text>
    <text x="624" y="548" font-size="14" font-weight="600" class="h">$1,134.55</text>
    <text x="1052" y="528" font-size="11" text-anchor="end" fill="#34d399">96%</text>
    <rect x="900" y="538" width="152" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.08"/><rect x="900" y="538" width="146" height="5" rx="2.5" fill="#34d399"/>
  </g>
  <!-- footer status -->
  <rect x="624" y="600" width="428" height="64" rx="10" fill="#16161f" stroke="#ffffff" stroke-opacity="0.06"/>
  <circle cx="648" cy="632" r="4" fill="#34d399"/>
  <text x="664" y="628" font-size="12" class="h">Validation passed</text>
  <text x="664" y="646" font-size="10.5" class="s">schema match · totals reconcile · ready to export</text>
</svg>
