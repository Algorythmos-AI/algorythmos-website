  <rect x="720" y="490" width="360" height="210" rx="14" fill="#15151f" stroke="#ffffff" stroke-opacity="0.07"/>
  <text x="744" y="526" font-size="14" font-weight="600" class="h">Governed metrics</text>
  <g>
    <circle cx="748" cy="558" r="3" fill="#a78bfa"/><text x="762" y="562" font-size="12" class="h">revenue</text><text x="1056" y="562" font-size="11" text-anchor="end" class="s">certified</text>
    <circle cx="748" cy="592" r="3" fill="#a78bfa"/><text x="762" y="596" font-size="12" class="h">net_revenue_retention</text><text x="1056" y="596" font-size="11" text-anchor="end" class="s">certified</text>
