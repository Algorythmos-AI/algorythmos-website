  <text x="744" y="298" font-size="14" font-weight="600" class="h">Pipeline trend</text>
  <path d="M744 432 L744 412 L792 418 L840 398 L888 404 L936 378 L984 388 L1032 360 L1056 366 L1056 432 Z" fill="url(#sd-area)"/>
  <polyline points="744,412 792,418 840,398 888,404 936,378 984,388 1032,360 1056,366" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

