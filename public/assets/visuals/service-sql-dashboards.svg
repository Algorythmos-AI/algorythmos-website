    <text x="62" y="225" font-size="11" fill="#34d399">▲ 8.1%</text>
  </g>
  <g>
    <rect x="304" y="140" width="250" height="98" rx="13" fill="#15151f" stroke="#ffffff" stroke-opacity="0.07"/>
