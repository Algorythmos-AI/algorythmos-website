    <linearGradient id="sd-bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
    <style>text{font-family:'Inter',system-ui,-apple-system,Segoe UI,sans-serif;}.h{fill:#f3f3f8;}.m{fill:#9a9cb4;}.s{fill:#6c6e86;}</style>
  </defs>
  <rect width="1120" height="760" fill="#0c0c13"/>
  <rect width="1120" height="48" fill="#14141e"/>
  <line x1="0" y1="48" x2="1120" y2="48" stroke="#ffffff" stroke-opacity="0.07"/>
  <circle cx="24" cy="24" r="5" fill="#ffffff" fill-opacity="0.18"/><circle cx="42" cy="24" r="5" fill="#ffffff" fill-opacity="0.18"/><circle cx="60" cy="24" r="5" fill="#ffffff" fill-opacity="0.18"/>
  <rect x="392" y="12" width="336" height="24" rx="12" fill="#222232"/>
  <text x="560" y="29" font-size="12" text-anchor="middle" class="m">app.algorythmos.com/dashboards</text>
  <text x="40" y="92" font-size="18" font-weight="600" class="h">Revenue overview</text>
